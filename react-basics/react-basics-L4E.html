    // 4h
    let App = () => {
        let [countClick, setCountClick] = React.useState(0)
        let [plural, setPlural] = React.useState('')
        let currentCount = React.useRef(countClick)
        let buttonRef = React.useRef()

        function clickCounterFunction() {
            if(countClick > 0) {
                setPlural('s')
            }
            setCountClick(countClick + 1)
        }

        function resetCounterFunction() {
            setCountClick(0)
            if(currentCount.current < 1) {
                setPlural('')
            }
        }

        function autoClickerFunction() {
            setInterval( () => {
                let buttonElem = buttonRef.current

                if(buttonElem) {
                    buttonElem.click()
                }
            },1000)
        }

        
        let ClickBtn = () => {
            return (
                <button onClick={clickCounterFunction} ref={buttonRef}>Clicked {countClick} time{plural}</button>
            );
        }

        let ResetBtn = () => {
            return (
                <button onClick={resetCounterFunction}>Reset Count</button>
            ); 
        }

        let AutoClickButton = () => {
             return (
                <button onClick={autoClickerFunction}>Auto Clicker</button>
            );
        }

        return (
            <>
                <ClickBtn/>
                <ResetBtn />
                <AutoClickButton />
            </>
        );
    }

    let root = ReactDOM.createRoot(document.querySelector('.js-container'))
    root.render(<App />)
