    // 3h
    let InputUserName = ({setName}) => {

        let [inputName, setInputName] = React.useState('');
        
        let saveInput = (e) => {
            setInputName(e.target.value)
        }
        
        setName(inputName)

        let resetInput = () => {
            setInputName('')
        }

        let exampleName = () => {
            setInputName('Peter John Reyes')
        }

        return(
            <>
                <input type="text" placeholder="Type a name here" onChange={saveInput} value={inputName}/>
                <button onClick={resetInput}>Reset</button>
                <button onClick={exampleName}>Example</button>
            </>
        );
    }

    let DisplayName = ({name, setName}) => {
        return(
            <>
                <p>Hello {name}</p>
            </>
        );
    }

    let App = () => {

        let [name, setName] = React.useState('');

        return(
            <>
                <InputUserName 
                    setName={setName}
                />
                <DisplayName 
                    name={name}
                    setName={setName}
                />
            </>
        );
    }

    let root = ReactDOM.createRoot(document.querySelector('.js-container'))
    root.render(<App />)
