<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="js-container"></div>



    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">

        

        
        //chat message component
        let ChatMessage = ({message, sender}) => {
            
            return (
                <>  
                {/* if sender is user this will show */}
                {sender === 'user' && (
                        <div className="chat-bot-div user">
                            <p className="chat-bot-message">{message}</p>
                            <img 
                            src="userIcon.png"
                            alt="user-icon"
                            width="40px"
                            />
                            </div>
                        )}

                        {/* if sender is robot this will show */}
                    {sender === 'robot' && (
                        <div className="chat-bot-div robot">
                            <img 
                            src="robotIcon.png" 
                            alt="robot-icon"
                            width="40px"
                            />
                            <p className="chat-bot-message">{message}</p>
                            </div>
                    )}
                    </>
                );
        }
        
        const todayIs = dayjs();

        //chatMessages and setChatMessages are from the App component and are used as props
        let ChatInput = ({chatMessages, setChatMessages, isLoading, setIsLoading}) => {
            
            const [inputText, setInputText] = React.useState('');
            

            // "e" means event
            let saveInputText = (e) => {
                setInputText(e.target.value)
            }

            
            let sendMessage = async (e) => {
                if(inputText.length > 0){
                    //controlled input
                    //this function sets the inputText = ''
                    setInputText('')
                    setIsLoading(true)
    
                    let response = await Chatbot.getResponseAsync(inputText)
    
                    //created a variable where the user chat message is saved so whenever the code runs, it is saved first before the response of the chatbot is added
                    let newChatMessages = [
                        //spread the existing array
                        ...chatMessages,
    
                        //this serves as the push of the state (this is added in the new set of array)
                        {
                            message: inputText,
                            sender: 'user',
                            id: crypto.randomUUID()
                        }
                        
                    ]
                    console.log(chatMessages)
                    //this is the updater function that updates the current data with the new chat message made by the user
                    setChatMessages(newChatMessages);
                    
                    
                    setChatMessages([
                        //spread the existing array
                        ...newChatMessages,
    
                        //this serves as the push of the state (this is added in the new set of array)
                        {
                            message:
                                    <img src='loading-spinner.gif' alt="loading-spinner" width="16px" style={{marginRight: '4px'}}/>,
                            sender: 'robot',
                            id: crypto.randomUUID()
                        }
                    ]);

    
                    //then this code will run after the new chat from the user is received
                    setTimeout( ()=> {
                        setIsLoading(false)

                        setChatMessages([
                            //spread the existing array
                            ...newChatMessages,
        
                            //this serves as the push of the state (this is added in the new set of array)
                            {
                                message: response,
                                sender: 'robot',
                                id: crypto.randomUUID()
                            }
                        ]);
                    }, 2500)
                }
                else{
                    return ;
                }
                
            }

            return (
                <>
                <div className="chat-input-container">
                    <input 
                        type="text" 
                        placeholder="Type anything..."
                        
                        onChange={saveInputText} 
                        //controlled input
                        value={inputText}
                        className="chat-input"
                        onKeyDown={(e) => {
                            if(e.key === 'Enter'){
                                isLoading === false && sendMessage();
                            }
                            else if(e.key === 'Escape'){
                                isLoading === false && setInputText('')
                            }
                            
                        }}                 
                    />
                    <button onClick={isLoading === false && sendMessage}> Send </button>
                </div>
                </>
            );
        }

        //chatMessages and setChatMessages are from the App component and are used as props
        const ChatMessages = ({chatMessages, setChatMessages}) => {
            const chatMessagesRef = useAutoScroll([chatMessages]);
            
            function useAutoScroll (dependencies) {
            
                const containerRef = React.useRef(null)

                //always put hooks in the top of the component, do not put hooks inside anything (if statement or function)
                //the array [chatMessages] is a dependency array = it is the control when useEffect runs
                //Best practice for a useEffect is to give it a dependency array to avoid running too often 
                React.useEffect( () => {
                    const containerElement = containerRef.current
                    

                    if(containerElement) {
                        containerElement.scrollTop = containerElement.scrollHeight;
                    }
                }, dependencies);

                return containerRef;
            }

            return(
                <>
                <div 
                    className="chat-messages-container"
                    ref={chatMessagesRef}
                >
                {chatMessages.map((chatMessage) => {
                        return(
                                <ChatMessage 
                                    key={chatMessage.id}
                                    message={chatMessage.message}
                                    sender={chatMessage.sender}
                                />
                        )
                    })}
                </div>
                </>
            );
        }
        
        //input box component

        let App = () => {

            //array destructuring
            //chatMessages is the original copy of the array (current data)
            //setChatMessages is the copied array once useState is used (updater function)
            //lifting the state up (since app is the main component it can be shared in the components below it)
            const [chatMessages, setChatMessages] = React.useState(
                //this is the initial value
                []
            );

            const [isLoading, setIsLoading] = React.useState(false)
            
            return (
                <>
                    {chatMessages.length === 0 ? <p className="welcome-message">Welcome to chatbot project! Send a message using the texbox below.</p> : ''}
                    <ChatMessages
                        chatMessages = {chatMessages}
                        setChatMessages = {setChatMessages}
                    />
                    <ChatInput 
                        chatMessages = {chatMessages}
                        setChatMessages = {setChatMessages}
                        isLoading = {isLoading}
                        setIsLoading = {setIsLoading}
                    />
                </>
            );
        }

        const root = ReactDOM.createRoot(document.querySelector('.js-container'))
        root.render(<App />)
       
    </script>
</body>

</html>
