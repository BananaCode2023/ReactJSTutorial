        // 2j
        let products = [
            {
                id: 1,
                name: 'Cotton Socks',
                price: 6.00,
                discount: 5.45,
                imgLink: 'cotton-socks.jpg'
            },
            {
                id: 2,
                name: 'Tennis Balls',
                price: 7.99,
                discount: 0,
                imgLink: 'tennis-balls.jpg'
            },
            {
                id: 3,
                name: 'Plain T-Shirt',
                price: 10.90,
                discount: 0,
                imgLink: 'plain-tshirt.jpg'
            },
        ]

        let App = () => {

            let ProductDetails = ({name, price,discount,imgLink}) => {
                return (
                    <div style={{border: "1px solid #ccc", width: "200px", display: "flex", flexDirection: "column", marginBottom: "8px", padding: "8px", gap: '0', lineHeight: '1.5px'}}>
                        <img src={imgLink} alt={name} />
                        <p>Product Name: {name}</p>
                        {discount > 0 ? 
                            (
                                <>
                                    <del>Price: ${price}</del>
                                    <p>Discount Price: ${discount}</p>
                                </>
                            ) : 
                            (
                                <>
                                    <p>Price: ${price}</p>
                                </>
                            )
                        }
                        <button>Add to Cart</button>
                    </div>
                );
            }

            return (
                <>
                    {products.map((product) => {
                        return (
                            <ProductDetails 
                                key={product.id}
                                name={product.name}
                                price={product.price}
                                discount={product.discount}
                                imgLink={product.imgLink}
                            />
                        );
                    })}
                </>
            );
        }

    let root = ReactDOM.createRoot(document.querySelector('.js-container'))
    root.render(<App />)
